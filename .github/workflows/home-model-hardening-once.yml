name: Home Boundary Cleanup Once

on:
  push:
    branches:
      - fix/global-hardening-20260904
    paths:
      - .github/workflows/home-model-hardening-once.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.repository == 'z13321812367-sys/ccswitchmulti'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/global-hardening-20260904
          fetch-depth: 0

      - name: Route all HOME resolution through config boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path_str, old, new, expected=1):
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path_str}: expected {expected} matches, found {count}: {old!r}")
              path.write_text(text.replace(old, new, expected), encoding="utf-8")

          replace_exact(
              "src-tauri/src/config.rs",
              '''pub fn get_home_dir() -> PathBuf {
              let test_override = std::env::var("CC_SWITCH_TEST_HOME").ok();
              resolve_home_dir(test_override.as_deref(), dirs::home_dir()).unwrap_or_else(|err| {
                  log::error!("{err}");
                  panic!("{err}");
              })
          }
          ''',
              '''pub fn try_get_home_dir() -> Result<PathBuf, String> {
              let test_override = std::env::var("CC_SWITCH_TEST_HOME").ok();
              resolve_home_dir(test_override.as_deref(), dirs::home_dir())
          }

          pub fn get_home_dir() -> PathBuf {
              try_get_home_dir().unwrap_or_else(|err| {
                  log::error!("{err}");
                  panic!("{err}");
              })
          }

          /// Expand `~`, `~/...`, and `~\\...` through the same validated HOME boundary.
          /// Missing or malformed HOME is an error; callers must not preserve a literal relative `~` path.
          pub fn expand_home_path(raw: &str) -> Result<PathBuf, String> {
              if raw == "~" {
                  return try_get_home_dir();
              }
              if let Some(stripped) = raw.strip_prefix("~/") {
                  return Ok(try_get_home_dir()?.join(stripped));
              }
              if let Some(stripped) = raw.strip_prefix("~\\\\") {
                  return Ok(try_get_home_dir()?.join(stripped));
              }
              Ok(PathBuf::from(raw))
          }

          /// Last-resort crash/exit observability directory when HOME itself is unavailable.
          /// This must never be used for the database, settings, provider config, or other user state.
          pub fn emergency_observability_dir() -> PathBuf {
              std::env::temp_dir().join("cc-switch-home-unavailable")
          }
          ''',
          )

          replace_exact(
              "src-tauri/src/config.rs",
              '''    #[test]
              fn explicit_relative_test_home_override_is_rejected() {
                  assert!(resolve_home_dir(Some("relative-test-home"), None).is_err());
              }
          ''',
              '''    #[test]
              fn explicit_relative_test_home_override_is_rejected() {
                  assert!(resolve_home_dir(Some("relative-test-home"), None).is_err());
              }

              #[test]
              fn emergency_observability_dir_is_named_temp_fallback() {
                  let path = emergency_observability_dir();
                  assert_eq!(
                      path.file_name().and_then(|name| name.to_str()),
                      Some("cc-switch-home-unavailable")
                  );
                  assert!(path.is_absolute());
              }
          ''',
          )

          observability_old = '''fn default_app_config_dir() -> PathBuf {
              dirs::home_dir()
                  .unwrap_or_else(|| PathBuf::from("."))
                  .join(".cc-switch")
          }
          '''
          observability_new = '''fn default_app_config_dir() -> PathBuf {
              match crate::config::try_get_home_dir() {
                  Ok(home) => home.join(".cc-switch"),
                  Err(err) => {
                      let fallback = crate::config::emergency_observability_dir();
                      eprintln!(
                          "[CC-Switch] HOME unavailable for crash/exit diagnostics: {err}; using {}",
                          fallback.display()
                      );
                      fallback
                  }
              }
          }
          '''
          replace_exact("src-tauri/src/app_exit_monitor.rs", observability_old, observability_new)
          replace_exact("src-tauri/src/panic_hook.rs", observability_old, observability_new)

          for path_str, fn_name in [
              ("src-tauri/src/app_store.rs", "resolve_path"),
              ("src-tauri/src/settings.rs", "resolve_override_path"),
          ]:
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")
              start = text.index(f"fn {fn_name}(raw: &str) -> PathBuf {{")
              end = text.index("\n}\n", start) + 3
              block = text[start:end]
              if block.count("dirs::home_dir()") != 3:
                  raise SystemExit(f"{path_str}: expected three legacy HOME lookups in {fn_name}")
              replacement = f'''fn {fn_name}(raw: &str) -> PathBuf {{
              crate::config::expand_home_path(raw).unwrap_or_else(|err| {{
                  log::error!("{{err}}");
                  panic!("{{err}}");
              }})
          }}\n'''
              path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          replace_exact(
              "src-tauri/src/claude_plugin.rs",
              '    let home = dirs::home_dir().ok_or_else(|| AppError::Config("无法获取用户主目录".into()))?;\n',
              '    let home = crate::config::try_get_home_dir().map_err(AppError::Config)?;\n',
          )
          replace_exact(
              "src-tauri/src/commands/misc.rs",
              '    let home = dirs::home_dir().unwrap_or_default();\n',
              '    let home = crate::config::get_home_dir();\n',
          )
          replace_exact(
              "src-tauri/src/database/backup.rs",
              '    dirs::home_dir().map(|path| path.to_string_lossy().to_string())\n',
              '    crate::config::try_get_home_dir().ok().map(|path| path.to_string_lossy().to_string())\n',
          )
          replace_exact(
              "src-tauri/src/prompt_files.rs",
              '        .or_else(|| dirs::home_dir().map(|h| h.join(fallback_dir)))\n',
              '        .or_else(|| crate::config::try_get_home_dir().ok().map(|h| h.join(fallback_dir)))\n',
          )
          replace_exact(
              "src-tauri/src/services/env_manager.rs",
              '    let home = dirs::home_dir().ok_or("无法获取用户主目录")?;\n',
              '    let home = crate::config::try_get_home_dir()?;\n',
          )

          replace_exact(
              "src-tauri/src/services/skill.rs",
              '    dirs::home_dir()\n        .map(|h| h.join(".agents").join("skills"))\n',
              '    crate::config::try_get_home_dir()\n        .ok()\n        .map(|h| h.join(".agents").join("skills"))\n',
          )
          replace_exact(
              "src-tauri/src/services/skill.rs",
              '    let path = match dirs::home_dir() {\n        Some(h) => h.join(".agents").join(".skill-lock.json"),\n        None => {\n            log::warn!("无法获取 HOME 目录，跳过解析 agents lock 文件");\n            return HashMap::new();\n        }\n    };\n',
              '    let path = match crate::config::try_get_home_dir() {\n        Ok(home) => home.join(".agents").join(".skill-lock.json"),\n        Err(err) => {\n            log::warn!("无法获取 HOME 目录，跳过解析 agents lock 文件: {err}");\n            return HashMap::new();\n        }\n    };\n',
          )
          replace_exact(
              "src-tauri/src/services/skill.rs",
              '                let home = dirs::home_dir().context("Cannot determine home directory")?;\n',
              '                let home = crate::config::try_get_home_dir().map_err(|err| anyhow!(err))?;\n',
          )

          replace_exact(
              "src-tauri/src/session_manager/providers/opencode.rs",
              '    dirs::home_dir()\n        .map(|h| h.join(".local/share/opencode"))\n        .unwrap_or_else(|| PathBuf::from(".local/share/opencode"))\n',
              '    crate::config::get_home_dir().join(".local/share/opencode")\n',
          )
          replace_exact(
              "src-tauri/src/session_manager/providers/opencode.rs",
              '    if let Ok(xdg) = std::env::var("XDG_DATA_HOME") {\n        if !xdg.is_empty() {\n            return PathBuf::from(xdg).join("opencode");\n        }\n    }\n',
              '    if let Ok(xdg) = std::env::var("XDG_DATA_HOME") {\n        let xdg = PathBuf::from(xdg.trim());\n        if xdg.is_absolute() {\n            return xdg.join("opencode");\n        }\n        if !xdg.as_os_str().is_empty() {\n            log::warn!("Ignoring relative XDG_DATA_HOME for OpenCode discovery: {}", xdg.display());\n        }\n    }\n',
          )

          offenders = []
          for path in Path("src-tauri/src").rglob("*.rs"):
              if path.name == "config.rs":
                  continue
              if "dirs::home_dir(" in path.read_text(encoding="utf-8"):
                  offenders.append(str(path))
          if offenders:
              raise SystemExit(f"direct dirs::home_dir remains: {offenders}")
          PY

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Run permanent policy guards
        run: |
          python scripts/check_workflow_shell_interpolation.py
          python scripts/check_rust_failure_boundaries.py
          git diff --check

      - name: Create frontend dist placeholder
        run: mkdir -p dist

      - name: Clippy all targets and features
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests default feature set
        run: cargo test --manifest-path src-tauri/Cargo.toml --all

      - name: Rust tests all features
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Commit verified HOME boundary migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src
          git diff --cached --check
          git commit -m "fix: centralize home resolution across persistence paths"
          git push origin HEAD:fix/global-hardening-20260904
