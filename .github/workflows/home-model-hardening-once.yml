name: Home Model Hardening Once

on:
  push:
    branches:
      - fix/global-hardening-20260904
    paths:
      - .github/workflows/home-model-hardening-once.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.repository == 'z13321812367-sys/ccswitchmulti'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/global-hardening-20260904
          fetch-depth: 0

      - name: Apply structure-aware HOME and model candidate fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          config_path = Path("src-tauri/src/config.rs")
          config = config_path.read_text(encoding="utf-8")

          old_return = "        return Ok(PathBuf::from(home));"
          new_return = """        let path = PathBuf::from(home);
          if path.is_absolute() {
              return Ok(path);
          }
          return Err(format!(
              "CC_SWITCH_TEST_HOME 必须是绝对路径，收到: {}",
              path.display()
          ));"""
          if config.count(old_return) != 1:
              raise SystemExit(f"expected one unvalidated test-home return, found {config.count(old_return)}")
          config = config.replace(old_return, new_return, 1)

          test_start_marker = "    #[test]\n    fn explicit_test_home_override_remains_supported() {"
          if config.count(test_start_marker) != 1:
              raise SystemExit("expected one legacy explicit test-home test")
          test_start = config.index(test_start_marker)
          test_end = config.index("\n\n    #[test]", test_start + len(test_start_marker))
          captured = config[test_start:test_end]
          hashset_import = "    use std::collections::HashSet;"
          if captured.count(hashset_import) != 1:
              raise SystemExit(
                  f"expected HashSet import inside replaced HOME-test segment, found {captured.count(hashset_import)}"
              )
          replacement_tests = """    #[test]
          fn explicit_absolute_test_home_override_remains_supported() {
              let override_home = std::env::temp_dir().join("cc-switch-test-home");
              let override_text = override_home.to_string_lossy().to_string();
              assert_eq!(
                  resolve_home_dir(Some(&override_text), None).unwrap(),
                  override_home
              );
          }

          #[test]
          fn explicit_relative_test_home_override_is_rejected() {
              assert!(resolve_home_dir(Some("relative-test-home"), None).is_err());
          }

          use std::collections::HashSet;"""
          config = config[:test_start] + replacement_tests + config[test_end:]
          config_path.write_text(config, encoding="utf-8")

          model_path = Path("src-tauri/src/services/model_fetch.rs")
          model = model_path.read_text(encoding="utf-8")

          timeout_marker = "const FETCH_TIMEOUT_SECS: u64 = 15;\n"
          helpers = """const MAX_CANDIDATE_FAILURE_DETAILS: usize = 8;

          fn should_try_next_models_candidate(status: StatusCode) -> bool {
              status == StatusCode::NOT_FOUND
                  || status == StatusCode::METHOD_NOT_ALLOWED
                  || status.is_server_error()
          }

          fn request_error_kind(error: &reqwest::Error) -> &'static str {
              if error.is_timeout() {
                  "timeout"
              } else if error.is_connect() {
                  "connect"
              } else if error.is_request() {
                  "request"
              } else if error.is_body() {
                  "body"
              } else if error.is_decode() {
                  "decode"
              } else {
                  "transport"
              }
          }

          fn record_candidate_failure(failures: &mut Vec<String>, detail: String) {
              if failures.len() < MAX_CANDIDATE_FAILURE_DETAILS {
                  failures.push(detail);
              }
          }

          """
          if model.count(timeout_marker) != 1:
              raise SystemExit(f"expected one fetch-timeout marker, found {model.count(timeout_marker)}")
          model = model.replace(timeout_marker, timeout_marker + helpers, 1)

          old_accumulator = "    let mut last_err: Option<String> = None;\n"
          if model.count(old_accumulator) != 1:
              raise SystemExit("expected one legacy last_err accumulator")
          model = model.replace(
              old_accumulator,
              "    let mut candidate_failures: Vec<String> = Vec::new();\n",
              1,
          )

          old_loop = "    for url in &candidates {\n"
          if model.count(old_loop) != 1:
              raise SystemExit("expected one model candidate loop")
          model = model.replace(
              old_loop,
              "    for (index, url) in candidates.iter().enumerate() {\n        let ordinal = index + 1;\n",
              1,
          )

          send_start_marker = "        let response = match request_builder.send().await {"
          send_end_marker = "\n\n        let status = response.status();"
          if model.count(send_start_marker) != 1:
              raise SystemExit("expected one request send block")
          send_start = model.index(send_start_marker)
          send_end = model.index(send_end_marker, send_start)
          new_send = """        let response = match request_builder.send().await {
              Ok(r) => r,
              Err(error) => {
                  let kind = request_error_kind(&error);
                  log::debug!(
                      "[ModelFetch] candidate {ordinal}/{} transport failure: {kind}",
                      candidates.len()
                  );
                  record_candidate_failure(
                      &mut candidate_failures,
                      format!("candidate {ordinal}: transport {kind}"),
                  );
                  continue;
              }
          };"""
          model = model[:send_start] + new_send + model[send_end:]

          success_start_marker = "        if status.is_success() {"
          terminal_marker = "\n\n        let body = truncate_body(response.text().await.unwrap_or_default());\n        return Err(format!(\"HTTP {status}: {body}\"));"
          if model.count(success_start_marker) != 1 or model.count(terminal_marker) != 1:
              raise SystemExit("model success/terminal status boundaries are not unique")
          success_start = model.index(success_start_marker)
          terminal_start = model.index(terminal_marker, success_start)
          new_success = """        if status.is_success() {
              let body = match response.bytes().await {
                  Ok(body) => body,
                  Err(error) => {
                      let kind = request_error_kind(&error);
                      record_candidate_failure(
                          &mut candidate_failures,
                          format!("candidate {ordinal}: response body {kind}"),
                      );
                      continue;
                  }
              };
              let resp: ModelsResponse = match serde_json::from_slice(&body) {
                  Ok(resp) => resp,
                  Err(error) => {
                      log::debug!(
                          "[ModelFetch] candidate {ordinal}/{} returned invalid JSON: {error}",
                          candidates.len()
                      );
                      record_candidate_failure(
                          &mut candidate_failures,
                          format!("candidate {ordinal}: invalid JSON ({error})"),
                      );
                      continue;
                  }
              };
              let Some(data) = resp.data else {
                  record_candidate_failure(
                      &mut candidate_failures,
                      format!("candidate {ordinal}: response missing data array"),
                  );
                  continue;
              };

              let mut models: Vec<FetchedModel> = data
                  .into_iter()
                  .map(|m| FetchedModel {
                      context_window: extract_context_window(&m.extra),
                      id: m.id,
                      owned_by: m.owned_by,
                  })
                  .collect();

              enrich_missing_context_windows(&client, url, &mut models).await;
              models.sort_by(|a, b| a.id.cmp(&b.id));
              return Ok(models);
          }

          if should_try_next_models_candidate(status) {
              record_candidate_failure(
                  &mut candidate_failures,
                  format!("candidate {ordinal}: HTTP {status}"),
              );
              continue;
          }"""
          model = model[:success_start] + new_success + model[terminal_start:]

          final_start_marker = "    Err(format!(\n        \"All candidates failed: {}\","
          if model.count(final_start_marker) != 1:
              raise SystemExit("expected one legacy final candidate error")
          final_start = model.index(final_start_marker)
          final_end = model.index("\n}", final_start)
          new_final = """    let details = if candidate_failures.is_empty() {
              "no candidate diagnostics".to_string()
          } else {
              candidate_failures.join("; ")
          };
          Err(format!("All model endpoint candidates failed: {details}"))"""
          model = model[:final_start] + new_final + model[final_end:]

          test_anchor = "    #[test]\n    fn test_candidates_plain_root() {"
          if model.count(test_anchor) != 1:
              raise SystemExit("expected one model candidate test anchor")
          extra_tests = """    #[test]
          fn candidate_retry_policy_continues_discovery_only_for_compatible_failures() {
              assert!(should_try_next_models_candidate(StatusCode::NOT_FOUND));
              assert!(should_try_next_models_candidate(StatusCode::METHOD_NOT_ALLOWED));
              assert!(should_try_next_models_candidate(StatusCode::INTERNAL_SERVER_ERROR));
              assert!(should_try_next_models_candidate(StatusCode::BAD_GATEWAY));
              assert!(!should_try_next_models_candidate(StatusCode::BAD_REQUEST));
              assert!(!should_try_next_models_candidate(StatusCode::UNAUTHORIZED));
              assert!(!should_try_next_models_candidate(StatusCode::FORBIDDEN));
              assert!(!should_try_next_models_candidate(StatusCode::TOO_MANY_REQUESTS));
          }

          #[test]
          fn candidate_failure_details_are_bounded() {
              let mut failures = Vec::new();
              for index in 0..(MAX_CANDIDATE_FAILURE_DETAILS + 3) {
                  record_candidate_failure(&mut failures, format!("candidate {index}"));
              }
              assert_eq!(failures.len(), MAX_CANDIDATE_FAILURE_DETAILS);
          }

          """
          model = model.replace(test_anchor, extra_tests + test_anchor, 1)

          forbidden = [
              'return Err(format!("Request failed: {e}"));',
              'last_err = Some(format!("HTTP {status}: {body}"));',
              '"All candidates failed: {}"',
          ]
          for fragment in forbidden:
              if fragment in model:
                  raise SystemExit(f"legacy model candidate failure boundary remains: {fragment}")
          model_path.write_text(model, encoding="utf-8")
          PY

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Run permanent policy guards
        run: |
          python scripts/check_workflow_shell_interpolation.py
          python scripts/check_rust_failure_boundaries.py
          git diff --check

      - name: Create frontend dist placeholder
        run: mkdir -p dist

      - name: Clippy all targets and features
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests default feature set
        run: cargo test --manifest-path src-tauri/Cargo.toml --all

      - name: Rust tests all features
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Commit verified source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/config.rs src-tauri/src/services/model_fetch.rs
          git diff --cached --check
          git commit -m "fix: fail closed home override and retry model candidates"
          git push origin HEAD:fix/global-hardening-20260904
