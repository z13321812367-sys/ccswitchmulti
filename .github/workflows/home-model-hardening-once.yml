name: Home Boundary Cleanup Once

on:
  push:
    branches:
      - fix/global-hardening-20260904
    paths:
      - .github/workflows/home-model-hardening-once.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.repository == 'z13321812367-sys/ccswitchmulti'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/global-hardening-20260904
          fetch-depth: 0

      - name: Route all HOME resolution through config boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path_str: str, old: str, new: str, expected: int = 1) -> None:
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path_str}: expected {expected} matches, found {count}")
              path.write_text(text.replace(old, new, expected), encoding="utf-8")

          replace_exact(
              "src-tauri/src/config.rs",
              '''pub fn get_home_dir() -> PathBuf {
              let test_override = std::env::var("CC_SWITCH_TEST_HOME").ok();
              resolve_home_dir(test_override.as_deref(), dirs::home_dir()).unwrap_or_else(|err| {
                  log::error!("{err}");
                  panic!("{err}");
              })
          }
          ''',
              '''pub fn try_get_home_dir() -> Result<PathBuf, String> {
              let test_override = std::env::var("CC_SWITCH_TEST_HOME").ok();
              resolve_home_dir(test_override.as_deref(), dirs::home_dir())
          }

          pub fn get_home_dir() -> PathBuf {
              try_get_home_dir().unwrap_or_else(|err| {
                  log::error!("{err}");
                  panic!("{err}");
              })
          }

          /// 崩溃/退出诊断在 HOME 本身不可用时的最后观测目录。
          /// 该目录只允许用于故障证据，绝不能作为数据库、配置或用户数据的持久化根目录。
          pub fn emergency_observability_dir() -> PathBuf {
              std::env::temp_dir().join("cc-switch-home-unavailable")
          }
          ''',
          )

          replace_exact(
              "src-tauri/src/config.rs",
              '''    #[test]
              fn explicit_relative_test_home_override_is_rejected() {
                  assert!(resolve_home_dir(Some("relative-test-home"), None).is_err());
              }
          ''',
              '''    #[test]
              fn explicit_relative_test_home_override_is_rejected() {
                  assert!(resolve_home_dir(Some("relative-test-home"), None).is_err());
              }

              #[test]
              fn emergency_observability_dir_is_named_temp_fallback() {
                  let path = emergency_observability_dir();
                  assert_eq!(
                      path.file_name().and_then(|name| name.to_str()),
                      Some("cc-switch-home-unavailable")
                  );
                  assert!(path.is_absolute());
              }
          ''',
          )

          observability_old = '''fn default_app_config_dir() -> PathBuf {
              dirs::home_dir()
                  .unwrap_or_else(|| PathBuf::from("."))
                  .join(".cc-switch")
          }
          '''
          observability_new = '''fn default_app_config_dir() -> PathBuf {
              match crate::config::try_get_home_dir() {
                  Ok(home) => home.join(".cc-switch"),
                  Err(err) => {
                      let fallback = crate::config::emergency_observability_dir();
                      eprintln!(
                          "[CC-Switch] HOME unavailable for crash/exit diagnostics: {err}; using {}",
                          fallback.display()
                      );
                      fallback
                  }
              }
          }
          '''
          replace_exact("src-tauri/src/app_exit_monitor.rs", observability_old, observability_new)
          replace_exact("src-tauri/src/panic_hook.rs", observability_old, observability_new)

          resolve_path_old = '''fn resolve_path(raw: &str) -> PathBuf {
              if raw == "~" {
                  if let Some(home) = dirs::home_dir() {
                      return home;
                  }
              } else if let Some(stripped) = raw.strip_prefix("~/") {
                  if let Some(home) = dirs::home_dir() {
                      return home.join(stripped);
                  }
              } else if let Some(stripped) = raw.strip_prefix("~\\\\") {
                  if let Some(home) = dirs::home_dir() {
                      return home.join(stripped);
                  }
              }

              PathBuf::from(raw)
          }
          '''
          resolve_path_new = '''fn resolve_path(raw: &str) -> PathBuf {
              if raw == "~" {
                  return crate::config::get_home_dir();
              }
              if let Some(stripped) = raw.strip_prefix("~/") {
                  return crate::config::get_home_dir().join(stripped);
              }
              if let Some(stripped) = raw.strip_prefix("~\\\\") {
                  return crate::config::get_home_dir().join(stripped);
              }

              PathBuf::from(raw)
          }
          '''
          replace_exact("src-tauri/src/app_store.rs", resolve_path_old, resolve_path_new)

          replace_exact(
              "src-tauri/src/claude_plugin.rs",
              '    let home = dirs::home_dir().ok_or_else(|| AppError::Config("无法获取用户主目录".into()))?;\n',
              '    let home = crate::config::try_get_home_dir().map_err(AppError::Config)?;\n',
          )

          replace_exact(
              "src-tauri/src/commands/misc.rs",
              '    let home = dirs::home_dir().unwrap_or_default();\n',
              '    let home = crate::config::get_home_dir();\n',
          )

          replace_exact(
              "src-tauri/src/database/backup.rs",
              '''fn current_home_string() -> Option<String> {
              dirs::home_dir().map(|path| path.to_string_lossy().to_string())
          }
          ''',
              '''fn current_home_string() -> Option<String> {
              crate::config::try_get_home_dir()
                  .ok()
                  .map(|path| path.to_string_lossy().to_string())
          }
          ''',
          )

          replace_exact(
              "src-tauri/src/prompt_files.rs",
              '''    primary_path
                  .parent()
                  .map(|p| p.to_path_buf())
                  .or_else(|| dirs::home_dir().map(|h| h.join(fallback_dir)))
                  .ok_or_else(|| {
          ''',
              '''    primary_path
                  .parent()
                  .map(|p| p.to_path_buf())
                  .or_else(|| crate::config::try_get_home_dir().ok().map(|h| h.join(fallback_dir)))
                  .ok_or_else(|| {
          ''',
          )

          replace_exact(
              "src-tauri/src/services/env_manager.rs",
              '''fn get_backup_dir() -> Result<PathBuf, String> {
              let home = dirs::home_dir().ok_or("无法获取用户主目录")?;
              Ok(home.join(".cc-switch").join("backups"))
          }
          ''',
              '''fn get_backup_dir() -> Result<PathBuf, String> {
              let home = crate::config::try_get_home_dir()?;
              Ok(home.join(".cc-switch").join("backups"))
          }
          ''',
          )

          replace_exact(
              "src-tauri/src/services/skill.rs",
              '''fn get_agents_skills_dir() -> Option<PathBuf> {
              dirs::home_dir()
                  .map(|h| h.join(".agents").join("skills"))
                  .filter(|p| p.exists())
          }
          ''',
              '''fn get_agents_skills_dir() -> Option<PathBuf> {
              crate::config::try_get_home_dir()
                  .ok()
                  .map(|h| h.join(".agents").join("skills"))
                  .filter(|p| p.exists())
          }
          ''',
          )
          replace_exact(
              "src-tauri/src/services/skill.rs",
              '''    let path = match dirs::home_dir() {
                  Some(h) => h.join(".agents").join(".skill-lock.json"),
                  None => {
                      log::warn!("无法获取 HOME 目录，跳过解析 agents lock 文件");
                      return HashMap::new();
                  }
              };
          ''',
              '''    let path = match crate::config::try_get_home_dir() {
                  Ok(home) => home.join(".agents").join(".skill-lock.json"),
                  Err(err) => {
                      log::warn!("无法获取 HOME 目录，跳过解析 agents lock 文件: {err}");
                      return HashMap::new();
                  }
              };
          ''',
          )
          replace_exact(
              "src-tauri/src/services/skill.rs",
              '''            SkillStorageLocation::Unified => {
                      let home = dirs::home_dir().context("Cannot determine home directory")?;
                      home.join(".agents").join("skills")
                  }
          ''',
              '''            SkillStorageLocation::Unified => {
                      let home = crate::config::try_get_home_dir().map_err(|err| anyhow!(err))?;
                      home.join(".agents").join("skills")
                  }
          ''',
          )

          replace_exact(
              "src-tauri/src/session_manager/providers/opencode.rs",
              '''    dirs::home_dir()
                  .map(|h| h.join(".local/share/opencode"))
                  .unwrap_or_else(|| PathBuf::from(".local/share/opencode"))
          ''',
              '''    crate::config::get_home_dir().join(".local/share/opencode")
          ''',
          )

          replace_exact(
              "src-tauri/src/settings.rs",
              '''fn resolve_override_path(raw: &str) -> PathBuf {
              if raw == "~" {
                  if let Some(home) = dirs::home_dir() {
                      return home;
                  }
              } else if let Some(stripped) = raw.strip_prefix("~/") {
                  if let Some(home) = dirs::home_dir() {
                      return home.join(stripped);
                  }
              } else if let Some(stripped) = raw.strip_prefix("~\\\\") {
                  if let Some(home) = dirs::home_dir() {
                      return home.join(stripped);
                  }
              }

              PathBuf::from(raw)
          }
          ''',
              '''fn resolve_override_path(raw: &str) -> PathBuf {
              if raw == "~" {
                  return crate::config::get_home_dir();
              }
              if let Some(stripped) = raw.strip_prefix("~/") {
                  return crate::config::get_home_dir().join(stripped);
              }
              if let Some(stripped) = raw.strip_prefix("~\\\\") {
                  return crate::config::get_home_dir().join(stripped);
              }

              PathBuf::from(raw)
          }
          ''',
          )

          # XDG_DATA_HOME is specified as an absolute path. Ignore malformed relative values so
          # OpenCode discovery cannot bind to the process CWD.
          replace_exact(
              "src-tauri/src/session_manager/providers/opencode.rs",
              '''    if let Ok(xdg) = std::env::var("XDG_DATA_HOME") {
                  if !xdg.is_empty() {
                      return PathBuf::from(xdg).join("opencode");
                  }
              }
          ''',
              '''    if let Ok(xdg) = std::env::var("XDG_DATA_HOME") {
                  let xdg = PathBuf::from(xdg.trim());
                  if xdg.is_absolute() {
                      return xdg.join("opencode");
                  }
                  if !xdg.as_os_str().is_empty() {
                      log::warn!(
                          "Ignoring relative XDG_DATA_HOME for OpenCode discovery: {}",
                          xdg.display()
                      );
                  }
              }
          ''',
          )

          # The permanent guard must pass after the common-boundary migration.
          offenders = []
          for path in Path("src-tauri/src").rglob("*.rs"):
              if path.name == "config.rs":
                  continue
              if "dirs::home_dir(" in path.read_text(encoding="utf-8"):
                  offenders.append(str(path))
          if offenders:
              raise SystemExit(f"direct dirs::home_dir remains: {offenders}")
          PY

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Run permanent policy guards
        run: |
          python scripts/check_workflow_shell_interpolation.py
          python scripts/check_rust_failure_boundaries.py
          git diff --check

      - name: Create frontend dist placeholder
        run: mkdir -p dist

      - name: Clippy all targets and features
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests default feature set
        run: cargo test --manifest-path src-tauri/Cargo.toml --all

      - name: Rust tests all features
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Commit verified HOME boundary migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src-tauri/src/config.rs \
            src-tauri/src/app_exit_monitor.rs \
            src-tauri/src/panic_hook.rs \
            src-tauri/src/app_store.rs \
            src-tauri/src/claude_plugin.rs \
            src-tauri/src/commands/misc.rs \
            src-tauri/src/database/backup.rs \
            src-tauri/src/prompt_files.rs \
            src-tauri/src/services/env_manager.rs \
            src-tauri/src/services/skill.rs \
            src-tauri/src/session_manager/providers/opencode.rs \
            src-tauri/src/settings.rs
          git diff --cached --check
          git commit -m "fix: centralize home resolution across persistence paths"
          git push origin HEAD:fix/global-hardening-20260904
