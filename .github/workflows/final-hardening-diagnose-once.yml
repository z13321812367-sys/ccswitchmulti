name: Final Hardening Diagnose Once

on:
  push:
    branches:
      - fix/global-hardening-20260904
    paths:
      - .github/workflows/final-hardening-diagnose-once.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.repository == 'z13321812367-sys/ccswitchmulti'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/global-hardening-20260904
          fetch-depth: 0

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Apply exact final hardening patch
        run: python scripts/apply_final_global_hardening_once.py

      - name: Create frontend dist placeholder
        run: mkdir -p dist

      - name: Run all-feature Rust tests and persist failure diagnostics
        shell: bash
        run: |
          set -uo pipefail
          log=/tmp/final-hardening-rust-tests.log
          cargo test --manifest-path src-tauri/Cargo.toml --all-features 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "Final hardening Rust test failure diagnostics"
              echo "cargo_exit=$status"
              echo
              echo "=== failure markers ==="
              grep -n -E -- 'FAILED|failures:|panicked at|assertion .*failed|test result:|left:|right:|error: test failed|---- .* stdout ----' "$log" || true
              echo
              echo "=== final 1200 lines ==="
              tail -n 1200 "$log"
            } > .ci-final-hardening-test-failure.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .ci-final-hardening-test-failure.txt
            git diff --cached --check
            git commit -m "chore: capture final hardening test failure"
            git push origin HEAD:fix/global-hardening-20260904
          fi
          exit "$status"
