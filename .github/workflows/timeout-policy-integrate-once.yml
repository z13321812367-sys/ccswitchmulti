name: Timeout Policy Integrate Once

on:
  push:
    branches:
      - fix/global-hardening-20260904
    paths:
      - .github/workflows/timeout-policy-integrate-once.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'z13321812367-sys/ccswitchmulti'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/global-hardening-20260904
          fetch-depth: 0

      - name: Apply timeout policy integration
        run: python scripts/apply_timeout_policy_once.py

      - name: Format Rust with repository toolchain
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Run permanent failure-boundary guards
        run: |
          python scripts/check_workflow_shell_interpolation.py
          python scripts/check_rust_failure_boundaries.py

      - name: Verify patch
        run: git diff --check

      - name: Remove one-shot driver and commit
        run: |
          git rm scripts/apply_timeout_policy_once.py .github/workflows/timeout-policy-integrate-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/proxy/forwarder.rs src-tauri/src/proxy/handler_context.rs src-tauri/src/proxy/mod.rs src-tauri/src/proxy/timeout_policy.rs src-tauri/src/services/mod.rs
          git commit -m "fix: make proxy timeout semantics explicit"
          git push origin HEAD:fix/global-hardening-20260904
