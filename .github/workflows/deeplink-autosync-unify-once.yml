name: Deep Link Auto Sync Unify Once

on:
  push:
    branches:
      - fix/global-hardening-20260904
    paths:
      - .github/workflows/deeplink-autosync-unify-once.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'z13321812367-sys/ccswitchmulti'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/global-hardening-20260904
          fetch-depth: 0

      - name: Apply exact unification patches
        run: python scripts/apply_deeplink_autosync_unification_once.py

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Run permanent failure-boundary policy locally
        run: python scripts/check_rust_failure_boundaries.py

      - name: Verify patch diff
        run: git diff --check

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs src-tauri/src/services/webdav_auto_sync.rs src-tauri/src/services/s3_auto_sync.rs
          git diff --cached --check
          test -n "$(git status --porcelain)"
          git commit -m "fix: unify deep-link and auto-sync failure boundaries"
          git push origin HEAD:fix/global-hardening-20260904
