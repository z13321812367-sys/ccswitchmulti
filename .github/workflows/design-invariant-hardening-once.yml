name: Design Invariant Hardening Once

on:
  push:
    branches:
      - fix/global-hardening-20260904
    paths:
      - .github/workflows/design-invariant-hardening-once.yml
      - scripts/apply_design_invariant_hardening_once.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.repository == 'z13321812367-sys/ccswitchmulti'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/global-hardening-20260904
          fetch-depth: 0

      - name: Keep patch driver focused on product sources
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_design_invariant_hardening_once.py")
          text = path.read_text(encoding="utf-8")
          marker = "# ---------------------------------------------------------------------------\n# Permanent source-level guards encode the design invariants"
          if text.count(marker) != 1:
              raise SystemExit(f"design-driver policy boundary count={text.count(marker)}")
          text = text[:text.index(marker)] + 'print("Applied design-invariant product patch")\n'
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply design invariant hardening
        run: python scripts/apply_design_invariant_hardening_once.py

      - name: Propagate fallible path and worker contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str, old, new, label):
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_between(path_str, start, end, new, label):
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")
              if text.count(start) != 1:
                  raise SystemExit(f"{label}: start count={text.count(start)}")
              i = text.index(start)
              j = text.index(end, i)
              path.write_text(text[:i] + new + text[j:], encoding="utf-8")

          # Tauri command: Option means a genuine absence, Result means Store/path failure.
          replace_once(
              "src-tauri/src/commands/settings.rs",
              '''pub async fn get_app_config_dir_override(app: AppHandle) -> Result<Option<String>, String> {
              Ok(crate::app_store::refresh_app_config_dir_override(&app)
                  .map(|p| p.to_string_lossy().to_string()))
          }
          ''',
              '''pub async fn get_app_config_dir_override(app: AppHandle) -> Result<Option<String>, String> {
              let value = crate::app_store::refresh_app_config_dir_override(&app)
                  .map_err(|err| err.to_string())?;
              Ok(value.map(|p| p.to_string_lossy().to_string()))
          }
          ''',
              "app-config command error propagation",
          )

          # Skill APIs already return Result; do not hide a panic-capable path resolver inside them.
          replace_once(
              "src-tauri/src/services/skill.rs",
              "use crate::config::get_app_config_dir;\n",
              "",
              "skill obsolete infallible import",
          )
          replace_once(
              "src-tauri/src/services/skill.rs",
              '''            SkillStorageLocation::CcSwitch => get_app_config_dir().join("skills"),
                  SkillStorageLocation::Unified => {
                      let home = crate::config::get_home_dir();
                      home.join(".agents").join("skills")
                  }
          ''',
              '''            SkillStorageLocation::CcSwitch => crate::config::try_get_app_config_dir()
                      .map_err(|err| anyhow!(err))?
                      .join("skills"),
                  SkillStorageLocation::Unified => {
                      let home = crate::config::try_get_home_dir().map_err(|err| anyhow!(err))?;
                      home.join(".agents").join("skills")
                  }
          ''',
              "skill ssot fallible roots",
          )
          replace_once(
              "src-tauri/src/services/skill.rs",
              '''        let dir = get_app_config_dir().join("skill-backups");''',
              '''        let dir = crate::config::try_get_app_config_dir()
                      .map_err(|err| anyhow!(err))?
                      .join("skill-backups");''',
              "skill backup fallible root",
          )
          replace_once(
              "src-tauri/src/services/skill.rs",
              '''        let home = crate::config::get_home_dir();

                  Ok(match app {''',
              '''        let home = crate::config::try_get_home_dir().map_err(|err| anyhow!(err))?;

                  Ok(match app {''',
              "skill app-dir fallible home",
          )
          replace_once(
              "src-tauri/src/services/skill.rs",
              '''            SkillStorageLocation::CcSwitch => get_app_config_dir().join("skills"),''',
              '''            SkillStorageLocation::CcSwitch => crate::config::try_get_app_config_dir()
                      .map_err(|err| anyhow!(err))?
                      .join("skills"),''',
              "skill migration fallible app root",
          )

          # CLI discovery is best-effort. Missing HOME may remove home-specific candidates, but
          # must not crash discovery or manufacture relative candidates under process CWD.
          replace_between(
              "src-tauri/src/commands/misc.rs",
              "fn build_tool_search_paths(tool: &str) -> Vec<std::path::PathBuf> {",
              "\n#[cfg(target_os = \"windows\")]\nfn is_windows_command_script",
              '''fn build_tool_search_paths(tool: &str) -> Vec<std::path::PathBuf> {
              let home = crate::config::try_get_home_dir().ok();
              let mut search_paths: Vec<std::path::PathBuf> = Vec::new();

              if let Some(home) = home.as_ref() {
                  push_unique_path(&mut search_paths, home.join(".local/bin"));
                  push_unique_path(&mut search_paths, home.join(".npm-global/bin"));
                  push_unique_path(&mut search_paths, home.join("n/bin"));
                  push_unique_path(&mut search_paths, home.join(".volta/bin"));
                  extend_mise_node_search_paths(&mut search_paths, home);

                  let fnm_base = home.join(".local/state/fnm_multishells");
                  if let Ok(entries) = std::fs::read_dir(&fnm_base) {
                      for entry in entries.flatten() {
                          let bin_path = entry.path().join("bin");
                          if bin_path.exists() {
                              push_unique_path(&mut search_paths, bin_path);
                          }
                      }
                  }

                  let nvm_base = home.join(".nvm/versions/node");
                  if let Ok(entries) = std::fs::read_dir(&nvm_base) {
                      for entry in entries.flatten() {
                          let bin_path = entry.path().join("bin");
                          if bin_path.exists() {
                              push_unique_path(&mut search_paths, bin_path);
                          }
                      }
                  }
              } else {
                  log::warn!("HOME unavailable while discovering CLI tools; skipping home-scoped candidates");
              }

              #[cfg(target_os = "macos")]
              {
                  push_unique_path(&mut search_paths, std::path::PathBuf::from("/opt/homebrew/bin"));
                  push_unique_path(&mut search_paths, std::path::PathBuf::from("/usr/local/bin"));
                  if tool == "hermes" {
                      if let Some(home) = home.as_ref() {
                          let python_base = home.join("Library").join("Python");
                          if let Ok(entries) = std::fs::read_dir(&python_base) {
                              for entry in entries.flatten() {
                                  let bin_path = entry.path().join("bin");
                                  if bin_path.exists() {
                                      push_unique_path(&mut search_paths, bin_path);
                                  }
                              }
                          }
                      }
                  }
              }

              #[cfg(target_os = "linux")]
              {
                  push_unique_path(&mut search_paths, std::path::PathBuf::from("/usr/local/bin"));
                  push_unique_path(&mut search_paths, std::path::PathBuf::from("/usr/bin"));
              }

              #[cfg(target_os = "windows")]
              {
                  if let Some(appdata) = dirs::data_dir() {
                      push_unique_path(&mut search_paths, appdata.join("npm"));
                      if tool == "hermes" {
                          let python_base = appdata.join("Python");
                          if let Ok(entries) = std::fs::read_dir(&python_base) {
                              for entry in entries.flatten() {
                                  let scripts_path = entry.path().join("Scripts");
                                  if scripts_path.exists() {
                                      push_unique_path(&mut search_paths, scripts_path);
                                  }
                              }
                          }
                      }
                  }
                  if tool == "hermes" {
                      if let Some(local_data) = dirs::data_local_dir() {
                          let programs_python = local_data.join("Programs").join("Python");
                          if let Ok(entries) = std::fs::read_dir(&programs_python) {
                              for entry in entries.flatten() {
                                  let scripts_path = entry.path().join("Scripts");
                                  if scripts_path.exists() {
                                      push_unique_path(&mut search_paths, scripts_path);
                                  }
                              }
                          }
                      }
                  }
                  push_unique_path(&mut search_paths, std::path::PathBuf::from("C:\\Program Files\\nodejs"));
                  if let Some(home) = home.as_ref() {
                      extend_windows_cli_manager_search_paths(&mut search_paths, home);
                  }
              }

              if tool == "opencode" {
                  let empty_home = Path::new("");
                  let extra_paths = opencode_extra_search_paths(
                      home.as_deref().unwrap_or(empty_home),
                      std::env::var_os("OPENCODE_INSTALL_DIR"),
                      std::env::var_os("XDG_BIN_DIR"),
                      std::env::var_os("GOPATH"),
                  );
                  for path in extra_paths {
                      push_unique_path(&mut search_paths, path);
                  }
              }

              extend_from_cli_path_env(&mut search_paths, std::env::var_os("PATH"));
              search_paths
          }
          ''',
              "CLI discovery HOME fallback",
          )

          # OpenCode session roots are fallible. Invalid/missing HOME must be surfaced through the
          # session API rather than panicking. Existing SQLite errors are also observable.
          replace_between(
              "src-tauri/src/session_manager/providers/opencode.rs",
              "pub(crate) fn get_opencode_base_dir() -> PathBuf {",
              "\n/// Parse a SQLite source reference",
              '''fn try_get_opencode_base_dir() -> Result<PathBuf, String> {
              if let Ok(xdg) = std::env::var("XDG_DATA_HOME") {
                  let xdg = PathBuf::from(xdg.trim());
                  if xdg.is_absolute() {
                      return Ok(xdg.join("opencode"));
                  }
                  if !xdg.as_os_str().is_empty() {
                      log::warn!(
                          "Ignoring relative XDG_DATA_HOME for OpenCode discovery: {}",
                          xdg.display()
                      );
                  }
              }
              Ok(crate::config::try_get_home_dir()?.join(".local/share/opencode"))
          }

          /// Return the OpenCode JSON storage directory (legacy flat-file layout).
          pub(crate) fn get_opencode_data_dir() -> Result<PathBuf, String> {
              Ok(try_get_opencode_base_dir()?.join("storage"))
          }

          fn get_opencode_db_path() -> Result<PathBuf, String> {
              Ok(try_get_opencode_base_dir()?.join("opencode.db"))
          }

          /// Scan sessions from both the legacy JSON files and the newer SQLite database,
          /// merging results with SQLite taking precedence on ID conflicts.
          pub fn scan_sessions() -> Result<Vec<SessionMeta>, String> {
              let json_sessions = scan_sessions_json()?;
              let sqlite_sessions = scan_sessions_sqlite()?;

              if sqlite_sessions.is_empty() {
                  return Ok(json_sessions);
              }
              if json_sessions.is_empty() {
                  return Ok(sqlite_sessions);
              }

              let sqlite_ids: std::collections::HashSet<String> = sqlite_sessions
                  .iter()
                  .map(|s| s.session_id.clone())
                  .collect();
              let mut merged = sqlite_sessions;
              for session in json_sessions {
                  if !sqlite_ids.contains(&session.session_id) {
                      merged.push(session);
                  }
              }
              Ok(merged)
          }

          fn scan_sessions_json() -> Result<Vec<SessionMeta>, String> {
              let storage = get_opencode_data_dir()?;
              let session_dir = storage.join("session");
              if !session_dir.exists() {
                  return Ok(Vec::new());
              }

              let mut json_files = Vec::new();
              collect_json_files(&session_dir, &mut json_files);
              let mut sessions = Vec::new();
              for path in json_files {
                  if let Some(meta) = parse_session(&storage, &path) {
                      sessions.push(meta);
                  }
              }
              Ok(sessions)
          }
          ''',
              "OpenCode fallible roots and JSON scan",
          )
          replace_between(
              "src-tauri/src/session_manager/providers/opencode.rs",
              "fn scan_sessions_sqlite() -> Vec<SessionMeta> {",
              "\npub fn load_messages(path: &Path)",
              '''fn scan_sessions_sqlite() -> Result<Vec<SessionMeta>, String> {
              let db_path = get_opencode_db_path()?;
              if !db_path.exists() {
                  return Ok(Vec::new());
              }

              let conn = Connection::open_with_flags(
                  &db_path,
                  rusqlite::OpenFlags::SQLITE_OPEN_READ_ONLY | rusqlite::OpenFlags::SQLITE_OPEN_NO_MUTEX,
              )
              .map_err(|err| format!("Failed to open OpenCode session database {}: {err}", db_path.display()))?;

              let mut stmt = conn
                  .prepare(
                      "SELECT id, title, directory, time_created, time_updated FROM session ORDER BY time_updated DESC",
                  )
                  .map_err(|err| format!("Failed to prepare OpenCode session query: {err}"))?;

              let db_display = db_path.display().to_string();
              let iter = stmt
                  .query_map([], |row| {
                      let session_id: String = row.get(0)?;
                      let title: String = row.get(1)?;
                      let directory: String = row.get(2)?;
                      let created: i64 = row.get(3)?;
                      let updated: i64 = row.get(4)?;
                      Ok((session_id, title, directory, created, updated))
                  })
                  .map_err(|err| format!("Failed to query OpenCode sessions: {err}"))?;

              let mut sessions = Vec::new();
              for row in iter {
                  let (session_id, title, directory, created, updated) = row
                      .map_err(|err| format!("Failed to decode OpenCode session row: {err}"))?;
                  let display_title = if title.is_empty() {
                      path_basename(&directory)
                  } else {
                      Some(title)
                  };
                  sessions.push(SessionMeta {
                      provider_id: PROVIDER_ID.to_string(),
                      session_id: session_id.clone(),
                      title: display_title.clone(),
                      summary: display_title,
                      project_dir: if directory.is_empty() { None } else { Some(directory) },
                      created_at: Some(created),
                      last_active_at: Some(updated),
                      source_path: Some(format!("sqlite:{db_display}:{session_id}")),
                      resume_command: Some(format!("opencode session resume {session_id}")),
                  });
              }
              Ok(sessions)
          }
          ''',
              "OpenCode observable SQLite scan",
          )
          replace_once(
              "src-tauri/src/session_manager/providers/opencode.rs",
              '''    let expected_db_path = get_opencode_db_path()
                  .canonicalize()
          ''',
              '''    let expected_db_path = get_opencode_db_path()?
                  .canonicalize()
          ''',
              "OpenCode delete expected root",
          )

          # Session aggregation must not silently convert a provider panic into an empty provider.
          replace_between(
              "src-tauri/src/session_manager/mod.rs",
              "pub fn scan_sessions() -> Vec<SessionMeta> {",
              "\npub fn load_messages",
              '''pub fn scan_sessions() -> Result<Vec<SessionMeta>, String> {
              let (r1, r2, r3, r4, r5, r6) = std::thread::scope(|s| -> Result<_, String> {
                  let h1 = s.spawn(codex::scan_sessions);
                  let h2 = s.spawn(claude::scan_sessions);
                  let h3 = s.spawn(opencode::scan_sessions);
                  let h4 = s.spawn(openclaw::scan_sessions);
                  let h5 = s.spawn(gemini::scan_sessions);
                  let h6 = s.spawn(hermes::scan_sessions);

                  let r1 = h1.join().map_err(|_| "Codex session scan panicked".to_string())?;
                  let r2 = h2.join().map_err(|_| "Claude session scan panicked".to_string())?;
                  let r3 = h3
                      .join()
                      .map_err(|_| "OpenCode session scan panicked".to_string())??;
                  let r4 = h4.join().map_err(|_| "OpenClaw session scan panicked".to_string())?;
                  let r5 = h5.join().map_err(|_| "Gemini session scan panicked".to_string())?;
                  let r6 = h6.join().map_err(|_| "Hermes session scan panicked".to_string())?;
                  Ok((r1, r2, r3, r4, r5, r6))
              })?;

              let mut sessions = Vec::new();
              sessions.extend(r1);
              sessions.extend(r2);
              sessions.extend(r3);
              sessions.extend(r4);
              sessions.extend(r5);
              sessions.extend(r6);
              sessions.sort_by(|a, b| {
                  let a_ts = a.last_active_at.or(a.created_at).unwrap_or(0);
                  let b_ts = b.last_active_at.or(b.created_at).unwrap_or(0);
                  b_ts.cmp(&a_ts)
              });
              Ok(sessions)
          }
          ''',
              "session panic propagation",
          )
          replace_once(
              "src-tauri/src/session_manager/mod.rs",
              '''        "opencode" => vec![opencode::get_opencode_data_dir()],''',
              '''        "opencode" => vec![opencode::get_opencode_data_dir()?],''',
              "OpenCode deletion root propagation",
          )
          replace_once(
              "src-tauri/src/commands/session_manager.rs",
              '''pub async fn list_sessions() -> Result<Vec<session_manager::SessionMeta>, String> {
              let sessions = tauri::async_runtime::spawn_blocking(session_manager::scan_sessions)
                  .await
                  .map_err(|e| format!("Failed to scan sessions: {e}"))?;
              Ok(sessions)
          }
          ''',
              '''pub async fn list_sessions() -> Result<Vec<session_manager::SessionMeta>, String> {
              tauri::async_runtime::spawn_blocking(session_manager::scan_sessions)
                  .await
                  .map_err(|e| format!("Failed to scan sessions task: {e}"))?
          }
          ''',
              "session command error propagation",
          )
          PY

      - name: Encode design invariants in permanent policy
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/check_rust_failure_boundaries.py")
          text = path.read_text(encoding="utf-8")

          marker = "]\n\nfailures = []"
          if text.count(marker) != 1:
              raise SystemExit(f"FILE_CHECKS terminator count={text.count(marker)}")
          extra_checks = """    ("services/model_fetch.rs", re.compile(r'HTTP \\{status\\}: \\{body\\}'), "model-discovery errors must not expose raw upstream response bodies"),
              ("app_store.rs", re.compile(r"fn read_override_from_store\\([^)]*\\) -> Option<PathBuf>"), "Store read failure must not collapse into an absent app_config_dir override"),
              ("app_store.rs", re.compile(r"fn resolve_path\\(raw: &str\\) -> PathBuf"), "app_config_dir parsing must be fallible and reject relative persistence roots"),
              ("settings.rs", re.compile(r"fn settings_path\\(\\) -> Option<PathBuf>"), "settings path resolution must expose HOME failures instead of a fake Option contract"),
              ("services/skill.rs", re.compile(r"(?:get_app_config_dir|crate::config::get_home_dir)\\(\\)"), "Skill Result APIs must propagate fallible persistence roots instead of panicking"),
              ("commands/misc.rs", re.compile(r"let home = crate::config::get_home_dir\\(\\);"), "CLI discovery must degrade without HOME instead of panicking"),
              ("session_manager/mod.rs", re.compile(r"join\\(\\)\\.unwrap_or_default\\(\\)"), "session worker panics must be observable, not converted to empty results"),
              ("session_manager/providers/opencode.rs", re.compile(r"crate::config::get_home_dir\\(\\)"), "OpenCode session path resolution must be fallible"),
          """
          text = text.replace(marker, extra_checks + "]\n\nfailures = []", 1)

          anchor = """# User-home resolution is a persistence boundary shared by DB/config/backup/CLI paths. A direct
          # dirs::home_dir() call elsewhere can silently re-introduce CWD/relative fallback semantics or
          # diverge from the validated CC_SWITCH_TEST_HOME behavior, so keep one common implementation.
          """
          if text.count(anchor) != 1:
              raise SystemExit(f"home policy anchor count={text.count(anchor)}")
          extra_guard = """# Persistence roots must never accept a process-relative Store/settings override. These patterns
          # previously bypassed the HOME guard while still binding DB/config state to the launch CWD.
          config_text = (RUST_ROOT / "config.rs").read_text(encoding="utf-8")
          if 'let legacy_dir = PathBuf::from(trimmed).join(".cc-switch")' in config_text:
              failures.append(
                  "src-tauri/src/config.rs: Windows legacy HOME must be checked as absolute before DB fallback"
              )

          """
          text = text.replace(anchor, extra_guard + anchor, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Run permanent policy guards
        run: |
          python scripts/check_workflow_shell_interpolation.py
          python scripts/check_rust_failure_boundaries.py
          git diff --check

      - name: Create frontend dist placeholder
        run: mkdir -p dist

      - name: Clippy all targets and features
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests default feature set
        run: cargo test --manifest-path src-tauri/Cargo.toml --all

      - name: Rust tests all features
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Commit verified design fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src-tauri/src/config.rs \
            src-tauri/src/app_store.rs \
            src-tauri/src/settings.rs \
            src-tauri/src/lib.rs \
            src-tauri/src/database/mod.rs \
            src-tauri/src/services/model_fetch.rs \
            src-tauri/src/commands/settings.rs \
            src-tauri/src/services/skill.rs \
            src-tauri/src/commands/misc.rs \
            src-tauri/src/session_manager/mod.rs \
            src-tauri/src/session_manager/providers/opencode.rs \
            src-tauri/src/commands/session_manager.rs \
            scripts/check_rust_failure_boundaries.py
          git diff --cached --check
          git commit -m "fix: enforce persistence and diagnostic invariants"
          git push origin HEAD:fix/global-hardening-20260904
