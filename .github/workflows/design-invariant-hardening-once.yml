name: Design Invariant Hardening Once

on:
  push:
    branches:
      - fix/global-hardening-20260904
    paths:
      - .github/workflows/design-invariant-hardening-once.yml
      - scripts/apply_design_invariant_hardening_once.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.repository == 'z13321812367-sys/ccswitchmulti'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/global-hardening-20260904
          fetch-depth: 0

      - name: Normalize design driver guard insertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_design_invariant_hardening_once.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("old_checks_tail = '''")
          end = text.index("extra_guard_anchor = '''", start)
          replacement = '''checks_marker = "]\\n\\nfailures = []"
          if text.count(checks_marker) != 1:
              raise SystemExit(f"policy FILE_CHECKS terminator count={text.count(checks_marker)}")
          extra_checks = r'''\n    ("services/model_fetch.rs", re.compile(r'HTTP \\{status\\}: \\{body\\}'), "model-discovery errors must not expose raw upstream response bodies"),
              ("app_store.rs", re.compile(r"fn read_override_from_store\\([^)]*\\) -> Option<PathBuf>"), "Store read failure must not collapse into an absent app_config_dir override"),
              ("app_store.rs", re.compile(r"fn resolve_path\\(raw: &str\\) -> PathBuf"), "app_config_dir parsing must be fallible and reject relative persistence roots"),
              ("settings.rs", re.compile(r"fn settings_path\\(\\) -> Option<PathBuf>"), "settings path resolution must expose HOME failures instead of a fake Option contract"),'''
          text = text.replace(checks_marker, extra_checks + "\\n]\\n\\nfailures = []", 1)

          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply design invariant hardening
        run: python scripts/apply_design_invariant_hardening_once.py

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Run permanent policy guards
        run: |
          python scripts/check_workflow_shell_interpolation.py
          python scripts/check_rust_failure_boundaries.py
          git diff --check

      - name: Create frontend dist placeholder
        run: mkdir -p dist

      - name: Clippy all targets and features
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests default feature set
        run: cargo test --manifest-path src-tauri/Cargo.toml --all

      - name: Rust tests all features
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Commit verified design fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src-tauri/src/config.rs \
            src-tauri/src/app_store.rs \
            src-tauri/src/settings.rs \
            src-tauri/src/lib.rs \
            src-tauri/src/database/mod.rs \
            src-tauri/src/services/model_fetch.rs \
            scripts/check_rust_failure_boundaries.py
          git diff --cached --check
          git commit -m "fix: enforce persistence and diagnostic invariants"
          git push origin HEAD:fix/global-hardening-20260904
