name: Design Invariant Hardening Once

on:
  push:
    branches:
      - fix/global-hardening-20260904
    paths:
      - .github/workflows/design-invariant-hardening-once.yml
      - scripts/apply_design_invariant_hardening_once.py
      - scripts/apply_design_invariant_followup_once.py
      - scripts/apply_hermes_failure_boundary_once.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.repository == 'z13321812367-sys/ccswitchmulti'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/global-hardening-20260904
          fetch-depth: 0

      - name: Keep primary driver focused on product sources
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_design_invariant_hardening_once.py")
          text = path.read_text(encoding="utf-8")
          marker = "# ---------------------------------------------------------------------------\n# Permanent source-level guards encode the design invariants"
          if text.count(marker) != 1:
              raise SystemExit(f"design-driver policy boundary count={text.count(marker)}")
          path.write_text(text[:text.index(marker)] + 'print("Applied design-invariant product patch")\n', encoding="utf-8")
          PY

      - name: Apply common product invariants
        run: python scripts/apply_design_invariant_hardening_once.py

      - name: Align structural follow-up with both Skill HOME callers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_design_invariant_followup_once.py")
          text = path.read_text(encoding="utf-8")
          old = '    "skill app HOME",\n)\n'
          new = '    "skill app HOME",\n    expected=2,\n)\n'
          if text.count(old) != 1:
              raise SystemExit(f"skill HOME expectation marker count={text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply fallible caller and discovery invariants
        run: python scripts/apply_design_invariant_followup_once.py

      - name: Normalize Windows path literal emitted by follow-up
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src-tauri/src/commands/misc.rs")
          text = path.read_text(encoding="utf-8")
          old = r'std::path::PathBuf::from("C:\Program Files\nodejs")'
          new = r'std::path::PathBuf::from(r"C:\Program Files\nodejs")'
          if text.count(old) != 1:
              raise SystemExit(f"Windows nodejs literal count={text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Make Skill persistence guard reject only infallible wrappers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/check_rust_failure_boundaries.py")
          text = path.read_text(encoding="utf-8")
          old = r're.compile(r"(?:get_app_config_dir|crate::config::get_home_dir)\(\)")'
          new = r're.compile(r"\bget_app_config_dir\(\)|crate::config::get_home_dir\(\)")'
          if text.count(old) != 1:
              raise SystemExit(f"Skill guard matcher count={text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Align OpenCode tests with fallible scan contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src-tauri/src/session_manager/providers/opencode.rs")
          text = path.read_text(encoding="utf-8")
          old = "        let sessions = scan_sessions_sqlite();\n"
          new = "        let sessions = scan_sessions_sqlite().expect(\"scan sqlite sessions\");\n"
          if text.count(old) != 1:
              raise SystemExit(f"OpenCode successful scan test count={text.count(old)}")
          text = text.replace(old, new, 1)
          anchor = "    #[test]\n    fn load_messages_sqlite_reads_messages_and_parts() {\n"
          if text.count(anchor) != 1:
              raise SystemExit(f"OpenCode failure-test anchor count={text.count(anchor)}")
          failure_test = '''    #[test]
          #[allow(deprecated)]
          fn scan_sessions_sqlite_surfaces_schema_errors() {
              let _guard = opencode_env_lock().lock().expect("lock");
              let temp = tempdir().expect("tempdir");
              let original_xdg = std::env::var_os("XDG_DATA_HOME");
              std::env::set_var("XDG_DATA_HOME", temp.path());
              let base_dir = temp.path().join("opencode");
              std::fs::create_dir_all(&base_dir).expect("create base dir");
              let db_path = base_dir.join("opencode.db");
              let conn = Connection::open(&db_path).expect("open sqlite db");
              conn.execute_batch("CREATE TABLE unrelated (id TEXT PRIMARY KEY);")
                  .expect("create incompatible schema");
              drop(conn);
              let result = scan_sessions_sqlite();
              if let Some(value) = original_xdg {
                  std::env::set_var("XDG_DATA_HOME", value);
              } else {
                  std::env::remove_var("XDG_DATA_HOME");
              }
              let err = result.expect_err("missing session table must be observable");
              assert!(err.contains("Failed to prepare OpenCode session query"), "{err}");
          }

          '''
          path.write_text(text.replace(anchor, failure_test + anchor, 1), encoding="utf-8")
          PY

      - name: Scope Hermes config-write transform to production helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_hermes_failure_boundary_once.py")
          text = path.read_text(encoding="utf-8")
          old = '''replace_once(
              path,
              "    let config_path = get_hermes_config_path();\\n",
              "    let config_path = try_get_hermes_config_path()?;\\n",
              "Hermes write config path",
          )'''
          new = '''replace_once(
              path,
              """fn write_yaml_section_to_config_locked(
              section_key: &str,
              value: &serde_yaml::Value,
          ) -> Result<HermesWriteOutcome, AppError> {
              let config_path = get_hermes_config_path();
          """,
              """fn write_yaml_section_to_config_locked(
              section_key: &str,
              value: &serde_yaml::Value,
          ) -> Result<HermesWriteOutcome, AppError> {
              let config_path = try_get_hermes_config_path()?;
          """,
              "Hermes write config path",
          )'''
          if text.count(old) != 1:
              raise SystemExit(f"Hermes write-transform driver count={text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply Hermes fallible failure boundary
        run: python scripts/apply_hermes_failure_boundary_once.py

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Verify permanent design policies
        run: |
          python scripts/check_workflow_shell_interpolation.py
          python scripts/check_rust_failure_boundaries.py
          git diff --check

      - name: Create frontend dist placeholder
        run: mkdir -p dist

      - name: Clippy all targets and features
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests default feature set
        run: cargo test --manifest-path src-tauri/Cargo.toml --all

      - name: Rust tests all features
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Commit verified design fixes and remove one-shot machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            scripts/apply_design_invariant_hardening_once.py \
            scripts/apply_design_invariant_followup_once.py \
            scripts/apply_hermes_failure_boundary_once.py \
            .github/workflows/design-invariant-hardening-once.yml
          git add -A
          git diff --cached --check
          git commit -m "fix: enforce persistence and diagnostic invariants"
          git push origin HEAD:fix/global-hardening-20260904
