name: Final Hardening Apply Once

on:
  push:
    branches:
      - fix/global-hardening-20260904
    paths:
      - .github/workflows/final-hardening-apply-once.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.repository == 'z13321812367-sys/ccswitchmulti'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/global-hardening-20260904
          fetch-depth: 0

      - name: Apply exact global hardening patch
        run: python scripts/apply_final_global_hardening_once.py

      - name: Normalize secure body diagnostics and stale test baselines
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/proxy/handlers.rs")
          text = path.read_text(encoding="utf-8")

          prod_start_marker = "/// 取 body 前 `max_chars` 个字符的单行摘要："
          prod_end_marker = "/// 解析单个 SSE 块的 event 名与 data 负载"
          if text.count(prod_start_marker) != 1 or text.count(prod_end_marker) != 1:
              raise SystemExit("body_snippet production markers are not unique")
          start = text.index(prod_start_marker)
          end = text.index(prod_end_marker, start)
          block = text[start:end]
          if block.count("fn body_snippet(") != 1:
              raise SystemExit("expected exactly one body_snippet function in production block")
          text = text[:start] + text[end:]

          test_marker = "    #[test]\n    fn body_snippet_sanitizes_controls_and_truncates() {"
          if text.count(test_marker) != 1:
              raise SystemExit("expected exactly one body_snippet regression test")
          start = text.index(test_marker)
          next_test = text.find("\n    #[test]\n", start + len(test_marker))
          module_end = text.find("\n}", start + len(test_marker))
          candidates = [pos for pos in (next_test, module_end) if pos != -1]
          if not candidates:
              raise SystemExit("could not find end boundary for body_snippet regression test")
          end = min(candidates)
          text = text[:start] + text[end + 1:]

          stale_import = "        body_looks_like_sse, body_snippet, chat_sse_to_response_value,\n"
          if text.count(stale_import) != 1:
              raise SystemExit("expected exactly one stale body_snippet test import")
          text = text.replace(
              stale_import,
              "        body_looks_like_sse, chat_sse_to_response_value,\n",
              1,
          )

          stale_assert = r'                assert!(msg.contains("<html>\\nblocked</html>"), "{msg}");' + "\n"
          secure_assert = (
              '                assert!(msg.contains("body-shape: markup"), "{msg}");\n'
              '                assert!(msg.contains("body: bytes=21, sha256="), "{msg}");\n'
              '                assert!(!msg.contains("<html>"), "{msg}");\n'
              '                assert!(!msg.contains("blocked"), "{msg}");\n'
          )
          if text.count(stale_assert) != 1:
              raise SystemExit(
                  f"expected one stale raw-body diagnostics assertion, found {text.count(stale_assert)}"
              )
          text = text.replace(stale_assert, secure_assert, 1)

          if "body_snippet" in text:
              raise SystemExit("body_snippet identifier remains after exact removal")
          if stale_assert in text:
              raise SystemExit("raw upstream body expectation remains in diagnostics test")
          path.write_text(text, encoding="utf-8")
          print("normalized secure body diagnostics implementation and regression expectations")
          PY

      - name: Normalize all-target Clippy baselines
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          codex_path = Path("src-tauri/src/codex_config.rs")
          codex = codex_path.read_text(encoding="utf-8")
          codex_old = """    let Some(models) = value.as_object() else {\n        return None;\n    };\n"""
          codex_new = """    let models = value.as_object()?;\n"""
          if codex.count(codex_old) != 1:
              raise SystemExit(f"expected one codex let-else baseline, found {codex.count(codex_old)}")
          codex = codex.replace(codex_old, codex_new, 1)
          if codex_old in codex:
              raise SystemExit("codex let-else baseline remains")
          codex_path.write_text(codex, encoding="utf-8")

          settings_path = Path("src-tauri/src/settings.rs")
          settings = settings_path.read_text(encoding="utf-8")
          settings_old = """        let mut settings = AppSettings::default();\n        settings.show_in_tray = false;\n"""
          settings_new = """        let settings = AppSettings {\n            show_in_tray: false,\n            ..Default::default()\n        };\n"""
          if settings.count(settings_old) != 1:
              raise SystemExit(
                  f"expected one settings field-reassign baseline, found {settings.count(settings_old)}"
              )
          settings = settings.replace(settings_old, settings_new, 1)
          if settings_old in settings:
              raise SystemExit("settings field-reassign baseline remains")
          settings_path.write_text(settings, encoding="utf-8")

          print("normalized all-target Clippy baselines without lint suppression")
          PY

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Format with repository Rust toolchain
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Run permanent policy guards
        run: |
          python scripts/check_workflow_shell_interpolation.py
          python scripts/check_rust_failure_boundaries.py
          git diff --check

      - name: Create frontend dist placeholder
        run: mkdir -p dist

      - name: Clippy all targets and features
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests default feature set
        run: cargo test --manifest-path src-tauri/Cargo.toml --all

      - name: Rust tests all features
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Remove one-shot diagnostics and commit verified changes
        run: |
          git rm \
            scripts/apply_final_global_hardening_once.py \
            .github/workflows/final-hardening-apply-once.yml \
            .github/workflows/final-hardening-diagnose-once.yml \
            .ci-final-hardening-test-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close global diagnostics and rollback failure boundaries"
          git push origin HEAD:fix/global-hardening-20260904
